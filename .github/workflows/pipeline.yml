name: Engine Condition ML Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:

  build-and-test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r deployment/requirements.txt

      - name: Validate application
        run: |
          python -m py_compile deployment/app.py

      - name: Build Docker image
        run: |
          docker build -t engine-condition-ml deployment

      - name: Test Docker image
        run: |
          docker run -d \
            --name engine-condition-app \
            -p 7860:7860 \
            engine-condition-ml

          sleep 10

          docker ps

      - name: Stop Docker container
        run: |
          docker stop engine-condition-app
          docker rm engine-condition-app
